# Cloudflare Worker config for the problem-report proxy.
# Deploy with: npx wrangler deploy
name = "avr-controller-report-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# Publish on workers.dev, but don't expose per-version preview URLs —
# the report proxy only needs the one stable production URL.
workers_dev = true
preview_urls = false

# Repo can be overridden here without touching code.
[vars]
REPO = "Yorihito/symmetrical-carnival"

# KV namespace for per-IP rate limiting.
# Create it once, then paste the printed id below:
#   npx wrangler kv namespace create RATE_LIMIT
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# GITHUB_TOKEN and RATE_SALT are *secrets*, never put them here. Set with:
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put RATE_SALT
